name: Kernel Build X00TD 4.4 KSU SuSFS no log a10 finasu
on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository kernel (format owner/repo, JANGAN full URL)'
        required: true
        default: 'arazy79/kernel_4.4'
      branch:
        description: 'Branch / tag / commit yang di-checkout'
        required: true
        default: '11'
      defconfig:
        description: 'Nama file defconfig (dicari otomatis di arch/arm64/configs)'
        required: true
        default: 'X00TD_defconfig'
      toolchain:
        description: 'gnu = gcc 13 bawaan Ubuntu | llvm = Proton clang 13 | gcc = GCC 9'
        type: choice
        default: 'gnu'
        options:
          - gnu
          - llvm
          - gcc
      kcflags_w:
        description: 'Tekan semua warning (-w)'
        type: boolean
        default: false
      enable_ksu:
        description: 'Enable KernelSU'
        type: boolean
        default: true
      enable_susfs:
        description: 'Enable SuSFS'
        type: boolean
        default: true
      ksu_fork:
        description: 'Fork KernelSU — pilih finasu di sini'
        type: choice
        default: 'finasu'
        options:
          - bakasu
          - sukisu
          - finasu
          - backslashxx
      bakasu_ref:
        description: 'Ref BakaSU'
        required: true
        default: 'd5e9e025b8b49155f8014684d64c91742b465f65'
      sukisu_ref:
        description: 'Ref SukiSU-Ultra'
        required: true
        default: '0165c0556929f1b509a9b632a46ef09b67a7940e'
      finasu_ref:
        description: 'Ref FinaSU — master lebih stabil dari dev'
        required: true
        default: 'master'
      builder_ref:
        description: 'Ref repo builder'
        required: true
        default: 'mainline'
      ksu_debug:
        description: 'CONFIG_KSU_DEBUG'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Jakarta
      ARCH: arm64
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repo }}
          ref: ${{ github.event.inputs.branch }}
          path: kernel
          submodules: recursive

      - name: Fetch NonGKI builder repo
        run: |
          set -e
          mkdir -p /tmp/builder
          cd /tmp/builder
          git init -q
          git remote add origin https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
          git fetch -q --depth 1 origin "${{ github.event.inputs.builder_ref }}"
          git checkout -q FETCH_HEAD
          echo "Builder SHA: $(git rev-parse HEAD)"

      - name: Setup KernelSU
        if: ${{ github.event.inputs.enable_ksu == 'true' }}
        working-directory: kernel
        env:
          ENABLE_SUSFS: ${{ github.event.inputs.enable_susfs }}
          KSU_FORK: ${{ github.event.inputs.ksu_fork }}
          BAKASU_REF: ${{ github.event.inputs.bakasu_ref }}
          SUKISU_REF: ${{ github.event.inputs.sukisu_ref }}
          FINASU_REF: ${{ github.event.inputs.finasu_ref }}
        run: |
          case "$KSU_FORK" in
            sukisu)
              KSU_URL="https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${SUKISU_REF}/kernel/setup.sh"
              KSU_BRANCH="${SUKISU_REF}"
              KSU_REPO="https://github.com/SukiSU-Ultra/SukiSU-Ultra"
              ;;
            bakasu)
              KSU_URL="https://raw.githubusercontent.com/Baka-SU/BakaSU/${BAKASU_REF}/kernel/setup.sh"
              KSU_BRANCH="${BAKASU_REF}"
              KSU_REPO="https://github.com/Baka-SU/BakaSU"
              ;;
            finasu)
              KSU_URL="https://raw.githubusercontent.com/LyraVoid/FinaSU/${FINASU_REF}/kernel/setup.sh"
              KSU_BRANCH="${FINASU_REF}"
              KSU_REPO="https://github.com/LyraVoid/FinaSU"
              ;;
            backslashxx)
              [ "$ENABLE_SUSFS" = "true" ] && { echo "::error::backslashxx tidak pakai SuSFS"; exit 1; }
              KSU_URL="https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh"
              KSU_BRANCH="master"
              KSU_REPO="https://github.com/backslashxx/KernelSU"
              ;;
            *)
              echo "::error::fork tidak dikenal: $KSU_FORK"
              exit 1
              ;;
          esac
          echo "::group::KernelSU Setup"
          echo "Fork: $KSU_FORK | Ref: $KSU_BRANCH"
          if ! curl -fLSs --retry 3 --retry-delay 2 -o /tmp/ksu_setup.sh "$KSU_URL"; then
            echo "::error::Gagal unduh setup.sh dari $KSU_URL"
            git ls-remote --heads "$KSU_REPO" | sed 's#.*refs/heads/#  - #' | head -30 || true
            exit 1
          fi
          bash /tmp/ksu_setup.sh "$KSU_BRANCH"
          if [ -d KernelSU ]; then
            KSU_SHA="$(git -C KernelSU rev-parse HEAD)"
            echo "KSU Commit: $KSU_SHA"
            echo "::notice::Pin SHA ini kalau sudah jalan: $KSU_SHA"
          fi
          [ ! -f drivers/kernelsu/Kconfig ] && { echo "::error::Setup gagal — drivers/kernelsu/Kconfig hilang"; exit 1; }
          echo "::endgroup::"
      - name: KernelSU compat fixes — kernel 4.4
        if: ${{ github.event.inputs.enable_ksu == 'true' }}
        working-directory: kernel
        run: |
          KFILES=$(find -L drivers/kernelsu -type f \( -name '*.c' -o -name '*.h' \))
          for mk in drivers/kernelsu/Kbuild drivers/kernelsu/Makefile; do
            if [ -f "$mk" ] && ! grep -q 'std=gnu11' "$mk"; then
              echo 'ccflags-y += -std=gnu11' >> "$mk"
              echo "gnu11 added → $mk"
              break
            fi
          done
          sed -i --follow-symlinks '/MODULE_IMPORT_NS/d' $KFILES
          sed -i --follow-symlinks 's|linux/compiler_types.h|linux/compiler.h|' $KFILES
          sed -i --follow-symlinks '/sched/task_stack.h>/d' $KFILES
          sed -i --follow-symlinks 's/full_name_hash(NULL, dirpath, strlen(dirpath))/full_name_hash((const unsigned char *)dirpath, strlen(dirpath))/' $KFILES
          sed -i --follow-symlinks 's/group_info->gid\[i\]/group_info->blocks[i]/' $KFILES
          sed -i --follow-symlinks 's/security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), "ksu")/security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks))/' $KFILES
          if [ ! -f include/linux/static_call.h ]; then
            cat > include/linux/static_call.h <<'EOF'
#ifndef _KSU_STATIC_CALL_STUB_H
#define _KSU_STATIC_CALL_STUB_H
#define DECLARE_STATIC_CALL(name, func) extern typeof(func) *__ksu_sc_##name
#define DEFINE_STATIC_CALL(name, func) typeof(func) *__ksu_sc_##name = (func)
#define static_call(name) (*__ksu_sc_##name)
#define static_call_update(name, func) ((void)(__ksu_sc_##name = (func)))
#endif
EOF
            echo "static_call stub dibuat ✅"
          fi
          echo "Compat fixes selesai ✅"

      - name: FinaSU syscall_fn_t & UAPI fix
        if: ${{ github.event.inputs.enable_ksu == 'true' && github.event.inputs.ksu_fork == 'finasu' }}
        working-directory: kernel
        run: |
          HOOK_H="drivers/kernelsu/hook/syscall_hook.h"

          if [ ! -f "$HOOK_H" ]; then
            echo "::error::File syscall_hook.h tidak ketemu"
            find drivers/kernelsu -name "syscall_hook.h"
            exit 1
          fi

          if ! grep -q "KSU_SYSCALL_FN_T_FIX" "$HOOK_H"; then
            sed -i '1a\
/* KSU_SYSCALL_FN_T_FIX: fix syscall_fn_t untuk kernel 4.4 */\
#include <linux/linkage.h>\
#include <asm/ptrace.h>\
#ifndef syscall_fn_t\
typedef asmlinkage long (*syscall_fn_t)(const struct pt_regs *);\
#endif\
' "$HOOK_H"
            echo "syscall_fn_t sudah ditempel di syscall_hook.h ✅"
          else
            echo "syscall_fn_t fix sudah ada, skip ✅"
          fi

          if [ ! -d ./usr/include/asm ]; then
            make ARCH=arm64 -j$(nproc) headers_install INSTALL_HDR_PATH=./usr
            echo "UAPI headers dibuat ✅"
          fi

          echo "FinaSU fix untuk kernel 4.4 selesai ✅"

      - name: Apply SuSFS patch + inline hooks
        if: ${{ github.event.inputs.enable_ksu == 'true' && github.event.inputs.enable_susfs == 'true' }}
        working-directory: kernel
        env:
          KSU_FORK: ${{ github.event.inputs.ksu_fork }}
        run: |
          set -e
          BUILDER=/tmp/builder/Patches
          PATCH=""
          if [ -f susfs_x00td_44.patch ]; then
            PATCH="$PWD/susfs_x00td_44.patch"
            echo "Pakai patch lokal: susfs_x00td_44.patch"
          elif [ -f "$BUILDER/Patch/susfs_patch_to_4.4.patch" ]; then
            PATCH="$BUILDER/Patch/susfs_patch_to_4.4.patch"
            echo "Pakai patch builder: susfs_patch_to_4.4.patch"
          fi
          [ -z "$PATCH" ] && { echo "::error::Patch SuSFS tidak ketemu"; exit 1; }
          if git apply --check "$PATCH" 2>/dev/null; then
            git apply --whitespace=nowarn "$PATCH"
          else
            patch -p1 -N -F3 --no-backup-if-mismatch < "$PATCH"
          fi
          find . -name '*.rej' -print -exec cat {} \; && { echo "::error::Ada hunk SuSFS gagal"; exit 1; } || true
          echo "SuSFS kernel patch applied ✅"
          if [ "$KSU_FORK" = "sukisu" ] && [ -f "$BUILDER/Patch/sukisu_ultra_fixed.patch" ]; then
            cd drivers/kernelsu
            patch -p1 -N < "$BUILDER/Patch/sukisu_ultra_fixed.patch" || true
            cd -
            echo "SukiSU fix applied ✅"
          fi
          cp "$BUILDER/susfs_inline_hook_patches.sh" ./
          bash susfs_inline_hook_patches.sh ./ | tee /tmp/hook.log
          rm -f susfs_inline_hook_patches.sh
          MISSING=""
          for f in fs/exec.c fs/open.c fs/read_write.c fs/stat.c; do
            grep -q "ksu_" "$f" || MISSING="$MISSING hook-ksu:$f"
          done
          [ -n "$MISSING" ] && { echo "::error::Hook belum lengkap:$MISSING"; exit 1; }
          echo "Inline hooks lengkap ✅"

      - name: Manual hooks (tanpa SuSFS)
        if: ${{ github.event.inputs.enable_ksu == 'true' && github.event.inputs.enable_susfs != 'true' }}
        working-directory: kernel
        run: |
          set -e
          cp /tmp/builder/Patches/syscall_hook_patches.sh ./
          bash syscall_hook_patches.sh ./
          rm -f syscall_hook_patches.sh

      - name: Restore ccache
        id: ccache_restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache44-${{ github.event.inputs.toolchain }}-${{ github.run_id }}
          restore-keys: |
            ccache44-${{ github.event.inputs.toolchain }}-

      - name: Cache Proton Clang
        id: tc_cache
        if: ${{ github.event.inputs.toolchain == 'llvm' }}
        uses: actions/cache@v4
        with:
          path: ~/proton-clang
          key: toolchain44-llvm-proton13-v1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git patch \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libncurses-dev libssl-dev zstd wget xz-utils
          [ "${{ github.event.inputs.toolchain }}" = "gcc" ] && \
            sudo apt-get install -y gcc-9-aarch64-linux-gnu gcc-9-arm-linux-gnueabi

      - name: Fetch Proton Clang
        if: ${{ github.event.inputs.toolchain == 'llvm' && steps.tc_cache.outputs.cache-hit != 'true' }}
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang ~/proton-clang
          test -x ~/proton-clang/bin/clang || { echo "::error::Proton Clang hilang"; exit 1; }

      - name: Setup toolchain env
        env:
          TOOLCHAIN: ${{ github.event.inputs.toolchain }}
          KCFLAGS_W: ${{ github.event.inputs.kcflags_w }}
        run: |
          case "$TOOLCHAIN" in
            llvm)
              echo "TC_BIN=$HOME/proton-clang/bin" >> "$GITHUB_ENV"
              echo "TC_MAKE_ARGS=CC=clang CLANG_FLAGS=--target=aarch64-linux-gnu CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"
              ;;
            gcc)
              echo "TC_MAKE_ARGS=CC=aarch64-linux-gnu-gcc-9 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"
              ;;
            *)
              echo "TC_MAKE_ARGS=CC=aarch64-linux-gnu-gcc CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"
              ;;
          esac
          mkdir -p ~/ccache-bin
          ln -sf $(command -v ccache) ~/ccache-bin/aarch64-linux-gnu-gcc
          echo "$HOME/ccache-bin" >> "$GITHUB_PATH"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_NOHASHDIR=true" >> "$GITHUB_ENV"
          TC_KCFLAGS="-Wno-error"
          [ "$TOOLCHAIN" = "llvm" ] && TC_KCFLAGS="$TC_KCFLAGS -Wno-error=incompatible-pointer-types"
          [ "$KCFLAGS_W" = "true" ] && TC_KCFLAGS="-w"
          echo "TC_KCFLAGS=$TC_KCFLAGS" >> "$GITHUB_ENV"
      - name: Make defconfig
        working-directory: kernel
        run: |
          export PATH="$PATH${TC_BIN:+:$TC_BIN}"
          DEFCONFIG=$(find arch/arm64/configs -name "${{ github.event.inputs.defconfig }}" | head -1)
          [ -z "$DEFCONFIG" ] && { echo "::error::Defconfig tidak ketemu"; exit 1; }
          make ARCH=arm64 O=out $TC_MAKE_ARGS "${DEFCONFIG#arch/arm64/configs/}"
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y"
            echo "# CONFIG_DEBUG_INFO is not set"
          } >> out/.config
          make ARCH=arm64 O=out $TC_MAKE_ARGS olddefconfig

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="$PATH${TC_BIN:+:$TC_BIN}"
          make ARCH=arm64 O=out $TC_MAKE_ARGS KCFLAGS="$TC_KCFLAGS" -j$(nproc) Image.gz dtbs

      - name: Pack Image.gz-dtb
        working-directory: kernel
        run: |
          DTB=$(find out/arch/arm64/boot/dts -name "sdm660*.dtb" -o -name "sdm636*.dtb" | head -1)
          [ -z "$DTB" ] && { echo "::error::DTB tidak ketemu"; exit 1; }
          cat out/arch/arm64/boot/Image.gz "$DTB" > out/arch/arm64/boot/Image.gz-dtb

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-X00TD-4.4-FinaSU
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: warn

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache44-${{ github.event.inputs.toolchain }}-${{ github.run_id }}
