name: Kernel Build X00TD 4.4 HMP MIUI

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Nama file defconfig'
        required: true
        default: 'X00TD_defconfig'
      branch:
        description: 'Branch repo'
        required: true
        default: '11'
      ksu:
        description: 'Enable KernelSU Next?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
          
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-
    steps:
    
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/kernel_4.4
          ref: ${{ github.event.inputs.branch }}
          path: kernel
          submodules: recursive
          
      - name: Apply KernelSU Next
        if: ${{ github.event.inputs.ksu == 'true' }}
        run: |
          cd kernel
          echo "Applying KernelSU Next v1.0.2..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v1.0.2/kernel/setup.sh" | bash -s v1.0.2
          
          # Fix C99/C11 syntax untuk kernel 4.4 yang default C89
          if [ -f drivers/kernelsu/Kbuild ]; then
            echo 'ccflags-y += -std=gnu11' >> drivers/kernelsu/Kbuild
          elif [ -f drivers/kernelsu/Makefile ]; then
            echo 'ccflags-y += -std=gnu11' >> drivers/kernelsu/Makefile
          fi
          
          # Fix MODULE_IMPORT_NS (kernel < 5.4)
          sed -i '/MODULE_IMPORT_NS/d' drivers/kernelsu/ksu.c
          
          # Fix compiler_types.h (kernel < 4.18)
          sed -i 's|#include <linux/compiler_types.h>|#include <linux/compiler.h>|' drivers/kernelsu/allowlist.c
          
          # Fix task_stack.h (kernel < 4.9)
          find -L drivers/kernelsu -name "*.c" -exec sed -i '/#include <linux\/sched\/task_stack.h>/d' {} +
          
          # Fix full_name_hash signature (kernel < 4.17 = 2 args, bukan 3 args)
          sed -i 's/full_name_hash(NULL, dirpath, strlen(dirpath))/full_name_hash((const unsigned char *)dirpath, strlen(dirpath))/' drivers/kernelsu/throne_tracker.c
          echo "Patched full_name_hash for kernel 4.4"
          
          echo "KSU Next applied."
          ls -la drivers/kernelsu/ || echo "WARNING: drivers/kernelsu/ not found!"
          
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.event.inputs.branch }}-${{ github.event.inputs.defconfig }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.event.inputs.branch }}-${{ github.event.inputs.defconfig }}-
            ccache-${{ github.event.inputs.branch }}-
            
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache flex git \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libncurses-dev libssl-dev
            
      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache --zero-stats
          
      - name: Debug check defconfig
        run: |
          echo "Branch: ${{ github.event.inputs.branch }}"
          echo "Defconfig: ${{ github.event.inputs.defconfig }}"
          echo "KSU: ${{ github.event.inputs.ksu }}"
          FOUND=$(find kernel/arch/arm64/configs -name "${{ github.event.inputs.defconfig }}" | head -1)
          [ -n "$FOUND" ] && echo "FOUND: $FOUND" || echo "NOT FOUND"
          
      - name: Make defconfig
        working-directory: kernel
        run: |
          DEFCONFIG_NAME="${{ github.event.inputs.defconfig }}"
          DEFCONFIG_PATH=$(find arch/arm64/configs -name "$DEFCONFIG_NAME" | head -1)
          [ -z "$DEFCONFIG_PATH" ] && { echo "ERROR: $DEFCONFIG_NAME not found"; exit 1; }
          DEFCONFIG_REL="${DEFCONFIG_PATH#arch/arm64/configs/}"
          make -j$(nproc) \
            ARCH=arm64 \
            O=out \
            CC="ccache aarch64-linux-gnu-gcc" \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            KCFLAGS="-Wno-error=enum-int-mismatch -Wno-error=incompatible-pointer-types" \
            "$DEFCONFIG_REL"
            
      - name: Build kernel
        working-directory: kernel
        run: |
          make -j$(nproc) \
            ARCH=arm64 \
            O=out \
            CC="ccache aarch64-linux-gnu-gcc" \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            KCFLAGS="-Wno-error=enum-int-mismatch -Wno-error=incompatible-pointer-types" \
            Image.gz dtbs
            
      - name: Pack Image.gz-dtb
        working-directory: kernel
        run: |
          DTB_PATH=""
          for pattern in "sdm636" "sdm660"; do
            FOUND=$(find out/arch/arm64/boot/dts -name "${pattern}*.dtb" | sort | head -1)
            if [ -n "$FOUND" ]; then
              DTB_PATH="$FOUND"
              echo "DTB selected: $DTB_PATH"
              break
            fi
          done
          if [ -n "$DTB_PATH" ]; then
            [ ! -f out/arch/arm64/boot/Image.gz ] && { echo "ERROR: Image.gz missing"; exit 1; }
            cat out/arch/arm64/boot/Image.gz "$DTB_PATH" > out/arch/arm64/boot/Image.gz-dtb
            ls -lh out/arch/arm64/boot/Image.gz-dtb
          else
            echo "ERROR: No sdm636/sdm660 DTB found"
            exit 1
          fi
          
      - name: Build summary
        if: always()
        run: |
          echo "=== KSU Status ==="
          [ "${{ github.event.inputs.ksu }}" = "true" ] \
            && echo "KernelSU Next: ENABLED" \
            || echo "KernelSU Next: DISABLED"
          echo ""
          echo "=== Boot files ==="
          ls -lh kernel/out/arch/arm64/boot/ 2>/dev/null || echo "(empty)"
          echo ""
          echo "=== ccache stats ==="
          ccache --show-stats 2>/dev/null || echo "ccache not available in PATH"
          
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-4.4-HMP-MIUI-KSU${{ github.event.inputs.ksu }}-${{ github.run_id }}
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: warn
