name: Kernel Build X00TD 4.4 SukiSU SuSFS
on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository kernel'
        required: true
        default: 'arazy79/kernel_4.4'
      branch:
        description: 'Branch kernel'
        required: true
        default: '11-miui'
      defconfig:
        description: 'Defconfig'
        required: true
        default: 'X00TD_defconfig'
      toolchain:
        description: 'Toolchain'
        type: choice
        default: 'proton 13'
        options:
          - gnu 13
          - proton 13
          - gcc 9
      kcflags_w:
        description: 'Tampilkan semua warning'
        type: boolean
        default: false
      enable_ksu:
        description: 'Aktifkan KernelSU'
        type: boolean
        default: true
      enable_susfs:
        description: 'Aktifkan SuSFS'
        type: boolean
        default: true
      ksu_fork:
        description: 'Fork KernelSU'
        type: choice
        default: 'sukisu'
        options:
          - sukisu
          - bakasu
          - backslashxx
      builder_ref:
        description: 'SHA Builder'
        required: true
        default: 'dcd789634247c77d8549a42aef232c680a905585'
      ksu_debug:
        description: 'Debug KSU'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Jakarta
      ARCH: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repo }}
          ref: ${{ github.event.inputs.branch }}
          path: kernel

      - name: Ambil builder
        run: |
          mkdir -p /tmp/builder
          cd /tmp/builder
          git init -q
          git remote add origin https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
          git fetch -q --depth 1 origin "${{ github.event.inputs.builder_ref }}"
          git checkout -q FETCH_HEAD

      - name: Setup KernelSU
        if: ${{ github.event.inputs.enable_ksu }}
        working-directory: kernel
        env:
          ENABLE_SUSFS: ${{ github.event.inputs.enable_susfs }}
          KSU_FORK: ${{ github.event.inputs.ksu_fork }}
        run: |
          set -e
          case "$KSU_FORK" in
            sukisu)
              KSU_URL="https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/refs/heads/main/kernel/setup.sh"
              KSU_BRANCH="main"
              ;;
            bakasu)
              KSU_URL="https://raw.githubusercontent.com/Baka-SU/BakaSU/refs/heads/main/kernel/setup.sh"
              KSU_BRANCH="main"
              ;;
            backslashxx)
              [ "$ENABLE_SUSFS" = "true" ] && exit 1
              KSU_URL="https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh"
              KSU_BRANCH="master"
              ;;
            *) exit 1 ;;
          esac
          curl -fLSs -o /tmp/ksu.sh "$KSU_URL"
          bash /tmp/ksu.sh "$KSU_BRANCH"
          ls -la drivers/kernelsu/

      - name: Fix kompilasi
        if: ${{ github.event.inputs.enable_ksu }}
        working-directory: kernel
        run: |
          # Cek file langsung di lokasi aslinya
          if [ -d KernelSU/kernel ]; then
            KF=$(find KernelSU/kernel -type f \( -name '*.c' -o -name '*.h' \))
          else
            KF=$(find drivers/kernelsu -type f \( -name '*.c' -o -name '*.h' \))
          fi
          [ -z "$KF" ] && echo "⚠️ Tidak nemu file KSU, skip fix" && exit 0

          echo "File yang difix:"
          echo "$KF"

          # Tambah -std=gnu11
          for mk in drivers/kernelsu/Kbuild drivers/kernelsu/Makefile; do
            if [ -f "$mk" ] && ! grep -q gnu11 "$mk"; then
              echo 'ccflags-y += -std=gnu11' >> "$mk"
              echo "✅ gnu11 ditambah ke $mk"
              break
            fi
          done

          # Fix header & fungsi kernel 4.4
          sed -i '/MODULE_IMPORT_NS/d' $KF || true
          sed -i 's/#include <linux\/compiler_types.h>/#include <linux\/compiler.h>/' $KF || true
          sed -i '/#include <linux\/sched\/task_stack.h>/d' $KF || true
          sed -i 's/full_name_hash(NULL, /full_name_hash((const unsigned char *)/' $KF || true
          sed -i 's/group_info->gid\[i\]/group_info->blocks[i]/' $KF || true
          sed -i 's/, "ksu")//' $KF || true

          echo "✅ Fix selesai"

      - name: Pasang SuSFS
        if: ${{ github.event.inputs.enable_ksu && github.event.inputs.enable_susfs }}
        working-directory: kernel
        run: |
          set -e
          P=""
          [ -f susfs_x00td_44.patch ] && P="$PWD/susfs_x00td_44.patch" || P="/tmp/builder/Patches/Patch/susfs_patch_to_4.4.patch"
          [ ! -f "$P" ] && echo "::error::Patch tidak ketemu: $P" && exit 1

          if git apply --check "$P" 2>/dev/null; then
            git apply --whitespace=nowarn "$P"
            echo "✅ SuSFS applied"
          else
            patch -p1 -N -F3 --no-backup-if-mismatch < "$P"
            echo "✅ SuSFS applied (patch)"
          fi

          cp /tmp/builder/Patches/susfs_inline_hook_patches.sh ./
          bash susfs_inline_hook_patches.sh ./
          rm -f susfs_inline_hook_patches.sh

      - name: Pasang dependensi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache flex git gcc-aarch64-linux-gnu libncurses-dev libssl-dev

      - name: Ambil Proton
        if: ${{ github.event.inputs.toolchain == 'proton 13' }}
        run: |
          git clone --depth 1 https://github.com/kdrag0n/proton-clang ~/proton-clang

      - name: Konfigurasi
        working-directory: kernel
        env:
          TC: ${{ github.event.inputs.toolchain }}
        run: |
          if [ "$TC" = "proton 13" ]; then
            export PATH="$HOME/proton-clang/bin:$PATH"
            MAK="CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-"
            KCF="-Wno-error"
          else
            MAK="CROSS_COMPILE=aarch64-linux-gnu-"
            KCF="-Wno-error"
          fi

          DEFCONFIG=$(find arch/arm64/configs -name "${{ github.event.inputs.defconfig }}")
          [ -z "$DEFCONFIG" ] && echo "::error::Defconfig tidak ketemu" && exit 1

          make ARCH=arm64 O=out $MAK "${DEFCONFIG#*/}"

          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
          } >> out/.config

          echo "# CONFIG_DEBUG_INFO is not set" >> out/.config
          make ARCH=arm64 O=out $MAK olddefconfig

          echo "TC_MAKE=$MAK" >> $GITHUB_ENV
          echo "TC_KC=$KCF" >> $GITHUB_ENV

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="$HOME/proton-clang/bin:$PATH"
          make ARCH=arm64 O=out $TC_MAKE KCFLAGS="$TC_KC" -j$(nproc) Image.gz dtbs

      - name: Gabung Image+DTB
        working-directory: kernel
        run: |
          DTB=$(find out/arch/arm64/boot/dts -name 'sdm660*.dtb' | head -1)
          [ -z "$DTB" ] && DTB=$(find out/arch/arm64/boot/dts -name 'sdm636*.dtb' | head -1)
          [ -z "$DTB" ] && echo "::error::DTB tidak ketemu" && exit 1
          cat out/arch/arm64/boot/Image.gz "$DTB" > out/arch/arm64/boot/Image.gz-dtb

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Kernel-X00TD-${{ github.run_id }}
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
