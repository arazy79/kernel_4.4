name: Kernel X00TD 4.4 SukiSU Fix
on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repo kernel'
        required: true
        default: 'arazy79/kernel_4.4'
      branch:
        description: 'Branch'
        required: true
        default: '11-miui'
      defconfig:
        description: 'Defconfig'
        required: true
        default: 'X00TD_defconfig'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ARCH: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repo }}
          ref: ${{ github.event.inputs.branch }}
          path: kernel

      - name: Setup SukiSU
        working-directory: kernel
        run: |
          set -e
          curl -fLSs -o /tmp/ksu.sh \
            https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh
          bash /tmp/ksu.sh main
          ls -la drivers/kernelsu/

      - name: Fix kernel 4.4
        working-directory: kernel
        run: |
          set -e
          KF=$(find KernelSU/kernel -type f \( -name '*.c' -o -name '*.h' \))
          [ -z "$KF" ] && { echo "::error::Tidak nemu file KSU"; exit 1; }

          sed -i '/MODULE_IMPORT_NS/d' $KF
          sed -i 's/#include <linux\/compiler_types.h>/#include <linux\/compiler.h>/' $KF
          sed -i '/#include <linux\/sched\/task_stack.h>/d' $KF
          sed -i 's/full_name_hash(NULL, /full_name_hash((const unsigned char *)/' $KF
          sed -i 's/group_info->gid\[i\]/group_info->blocks[i]/' $KF
          sed -i 's/, "ksu")//' $KF

          for mk in drivers/kernelsu/Kbuild drivers/kernelsu/Makefile; do
            if [ -f "$mk" ] && ! grep -q 'std=gnu11' "$mk"; then
              echo 'ccflags-y += -std=gnu11' >> "$mk"
              break
            fi
          done

      - name: Ambil Proton
        run: |
          git clone --depth 1 https://github.com/kdrag0n/proton-clang ~/proton-clang

      - name: Konfigurasi & Build
        working-directory: kernel
        run: |
          set -e
          DEFCONFIG=$(find arch/arm64/configs -name "${{ github.event.inputs.defconfig }}")
          [ -z "$DEFCONFIG" ] && echo "::error::Defconfig tidak ketemu" && exit 1

          # CLANG dari Proton, TAPI ld & alat host TETAP dari sistem
          PROTON_BIN="$HOME/proton-clang/bin"
          # PATH: sistem duluan → ld/bison/flex dari sistem, clang dipanggil langsung
          export PATH="/usr/bin:/usr/local/bin:$PATH"

          MAK="CC=$PROTON_BIN/clang \
            LD=/usr/bin/ld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            HOSTCC=gcc \
            HOSTLD=ld"

          make ARCH=arm64 O=out $MAK "${DEFCONFIG#*/}"

          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
          } >> out/.config
          echo "# CONFIG_DEBUG_INFO is not set" >> out/.config

          make ARCH=arm64 O=out $MAK olddefconfig
          make ARCH=arm64 O=out $MAK -j$(nproc) Image.gz dtbs

          DTB=$(find out/arch/arm64/boot/dts -name 'sdm660*.dtb' -o -name 'sdm636*.dtb' | head -1)
          [ -z "$DTB" ] && echo "::error::DTB tidak ketemu" && exit 1
          cat out/arch/arm64/boot/Image.gz "$DTB" > out/arch/arm64/boot/Image.gz-dtb
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: X00TD-Kernel-${{ github.run_id }}
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
