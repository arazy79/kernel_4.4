name: Kernel Build X00TD 4.4 KSU SuSFS no log a10 tes 2
on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository kernel (format owner/repo, JANGAN full URL)'
        required: true
        default: 'arazy79/kernel_4.4'
      branch:
        description: 'Branch / tag / commit yang di-checkout'
        required: true
        default: '11-miui'
      defconfig:
        description: 'Nama file defconfig (dicari otomatis di arch/arm64/configs)'
        required: true
        default: 'X00TD_defconfig'
      toolchain:
        description: 'gnu 13 = gcc 13 bawaan Ubuntu (sudah terbukti boot) | proton 13 = Proton clang 13 | gcc 9 = GCC 9'
        type: choice
        default: 'proton 13'
        options:
          - gnu 13
          - proton 13
          - gcc 9
      kcflags_w:
        description: 'Enable KCFLAGS=-w (tekan semua warning)'
        type: boolean
        default: false
      enable_ksu:
        description: 'Enable KernelSU (centang = ON)'
        type: boolean
        default: true
      enable_susfs:
        description: 'Enable SuSFS (butuh KSU ON; fork harus bakasu atau sukisu)'
        type: boolean
        default: true
      ksu_fork:
        description: 'Fork KernelSU. backslashxx hanya untuk SuSFS OFF'
        type: choice
        default: 'bakasu'
        options:
          - bakasu
          - sukisu
          - backslashxx
      bakasu_ref:
        description: 'SHA BakaSU yang terbukti sukses — JANGAN ganti ke main'
        required: true
        default: 'd5e9e025b8b49155f8014684d64c91742b465f65'
      builder_ref:
        description: 'Ref repo builder — pin SHA biar konsisten'
        required: true
        default: 'dcd789634247c77d8549a42aef232c680a905585'
      ksu_debug:
        description: 'Enable CONFIG_KSU_DEBUG'
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Jakarta
      ARCH: arm64
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repo }}
          ref: ${{ github.event.inputs.branch }}
          path: kernel
          submodules: recursive

      - name: Fetch NonGKI builder repo
        run: |
          set -e
          mkdir -p /tmp/builder
          cd /tmp/builder
          git init -q
          git remote add origin https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
          git fetch -q --depth 1 origin "${{ github.event.inputs.builder_ref }}"
          git checkout -q FETCH_HEAD
          echo "Builder SHA: $(git rev-parse HEAD)"

      - name: Setup KernelSU
        if: ${{ github.event.inputs.enable_ksu == 'true' }}
        working-directory: kernel
        env:
          ENABLE_SUSFS: ${{ github.event.inputs.enable_susfs }}
          KSU_FORK: ${{ github.event.inputs.ksu_fork }}
          BAKASU_REF: ${{ github.event.inputs.bakasu_ref }}
        run: |
          case "$KSU_FORK" in
            sukisu)
              KSU_URL="https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/refs/heads/main/kernel/setup.sh"
              KSU_BRANCH="builtin"
              KSU_REPO="https://github.com/SukiSU-Ultra/SukiSU-Ultra"
              ;;
            bakasu)
              KSU_URL="https://raw.githubusercontent.com/Baka-SU/BakaSU/${BAKASU_REF}/kernel/setup.sh"
              KSU_BRANCH="${BAKASU_REF}"
              KSU_REPO="https://github.com/Baka-SU/BakaSU"
              ;;
            backslashxx)
              if [ "$ENABLE_SUSFS" = "true" ]; then
                echo "::error::backslashxx tidak dipakai untuk SuSFS — pilih bakasu/sukisu"
                exit 1
              fi
              KSU_URL="https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh"
              KSU_BRANCH="master"
              KSU_REPO="https://github.com/backslashxx/KernelSU"
              ;;
            *)
              echo "::error::fork tidak dikenal: $KSU_FORK"
              exit 1
              ;;
          esac
          echo "::group::KernelSU setup"
          echo "KSU script : $KSU_URL"
          echo "KSU ref    : $KSU_BRANCH"
          if ! curl -fLSs --retry 3 --retry-delay 2 -o /tmp/ksu_setup.sh "$KSU_URL"; then
            echo "::error::Gagal download setup.sh — ref mungkin sudah dihapus"
            exit 1
          fi
          bash /tmp/ksu_setup.sh "$KSU_BRANCH"
          if [ -d KernelSU ]; then
            KSU_SHA="$(git -C KernelSU rev-parse HEAD)"
            echo "KSU commit : $KSU_SHA"
            echo "::notice::Salin SHA di atas ke bakasu_ref biar pin"
          fi
          ls -la drivers/kernelsu || true
          echo "::endgroup::"
          [ ! -f drivers/kernelsu/Kconfig ] && echo "::error::Kconfig hilang, setup gagal" && exit 1

      - name: KernelSU compat fixes + paksa runner.elf
        if: ${{ github.event.inputs.enable_ksu == 'true' }}
        working-directory: kernel
        run: |
          KFILES=$(find -L drivers/kernelsu -type f \( -name '*.c' -o -name '*.h' \))
          # C99/C11 untuk gcc 4.4
          for mk in drivers/kernelsu/Kbuild drivers/kernelsu/Makefile; do
            if [ -f "$mk" ] && ! grep -q 'std=gnu11' "$mk"; then
              echo 'ccflags-y += -std=gnu11' >> "$mk"
              echo "gnu11 ditambah ke $mk"
              break
            fi
          done
          # Fix header 4.4
          sed -i --follow-symlinks '/MODULE_IMPORT_NS/d' $KFILES
          sed -i --follow-symlinks 's|#include <linux/compiler_types.h>|#include <linux/compiler.h>|' $KFILES
          sed -i --follow-symlinks '/#include <linux\/sched\/task_stack.h>/d' $KFILES
          sed -i --follow-symlinks 's/full_name_hash(NULL, dirpath, strlen(dirpath))/full_name_hash((const unsigned char *)dirpath, strlen(dirpath))/' $KFILES
          sed -i --follow-symlinks 's/group_info->gid\[i\]/group_info->blocks[i]/' $KFILES
          sed -i --follow-symlinks 's/security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), "ksu")/security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks))/' $KFILES

          # === TAMBAHAN: PAKSA runner.elf DIBUAT DULU BIAR PROTON NGELUARIN ERROR ===
          echo "Memastikan runner.elf siap..."
          if [ -d drivers/kernelsu/preinit ]; then
            cd drivers/kernelsu/preinit
            make runner.elf 2>/dev/null || true
            if [ ! -f runner.elf ] && [ -f Makefile ]; then
              echo "blob.o: runner.elf" >> Makefile
              make runner.elf 2>/dev/null || true
            fi
            [ -f runner.elf ] && echo "✅ runner.elf siap" || echo "⚠️ runner.elf belum ada"
            cd ../../..
          fi
          echo "compat fixes selesai"

      - name: Apply SuSFS patch + hooks
        if: ${{ github.event.inputs.enable_ksu == 'true' && github.event.inputs.enable_susfs == 'true' }}
        working-directory: kernel
        env:
          KSU_FORK: ${{ github.event.inputs.ksu_fork }}
        run: |
          set -e
          BUILDER=/tmp/builder/Patches
          PATCH=""
          [ -f susfs_x00td_44.patch ] && PATCH="$PWD/susfs_x00td_44.patch" || \
          [ -f "$BUILDER/Patch/susfs_patch_to_4.4.patch" ] && PATCH="$BUILDER/Patch/susfs_patch_to_4.4.patch"
          [ -z "$PATCH" ] && echo "::error::Patch SuSFS 4.4 tidak ketemu" && exit 1

          if git apply -R --check "$PATCH" 2>/dev/null; then
            echo "SuSFS sudah ter-apply, skip"
          elif git apply --check "$PATCH" 2>/dev/null; then
            git apply --whitespace=nowarn "$PATCH"
            echo "SuSFS applied (git apply)"
          else
            patch -p1 -N -F3 --no-backup-if-mismatch < "$PATCH" || \
              { find . -name '*.rej' -print -exec cat {} \;; exit 1; }
            echo "SuSFS applied (patch -p1)"
          fi

          # Fix SukiSU
          if [ "$KSU_FORK" = "sukisu" ] && [ -f "$BUILDER/Patch/sukisu_ultra_fixed.patch" ]; then
            awk '/^diff --git /{n++} n>0{print > sprintf("/tmp/sfix/part%02d.p", n)}' "$BUILDER/Patch/sukisu_ultra_fixed.patch"
            cd drivers/kernelsu
            for p in /tmp/sfix/part*.p; do
              f=$(grep -m1 '^+++ ' "$p" | sed 's#^+++ [ab]/##')
              [ "$f" = "runtime/ksud.c" ] && { sed -i '/ksu_selinux_hide_handle/d' runtime/ksud.c; continue; }
              patch -p1 -N < "$p" || exit 1
            done
            cd ../../..
          fi

          # Inline hooks
          cp "$BUILDER/susfs_inline_hook_patches.sh" ./
          bash susfs_inline_hook_patches.sh ./ | tee /tmp/hook.log
          rm -f susfs_inline_hook_patches.sh
          grep -qiE "failed|warning" /tmp/hook.log && echo "::warning::Cek log hook di atas"

          # Cek kelengkapan
          MISSING=""
          for f in fs/exec.c fs/open.c fs/read_write.c fs/stat.c drivers/input/input.c kernel/reboot.c; do
            grep -q "ksu_" "$f" || MISSING="$MISSING hook-ksu:$f"
          done
          grep -q "susfs_def.h" fs/stat.c || MISSING="$MISSING include-susfs_def.h:fs/stat.c"
          grep -q "CONFIG_KSU_SUSFS" fs/namespace.c || MISSING="$MISSING susfs:fs/namespace.c"
          [ -n "$MISSING" ] && { echo "::error::Hook belum lengkap:$MISSING"; cat /tmp/hook.log; exit 1; }
          echo "Step SuSFS selesai"

      - name: Manual hooks tanpa SuSFS
        if: ${{ github.event.inputs.enable_ksu == 'true' && github.event.inputs.enable_susfs != 'true' }}
        working-directory: kernel
        run: |
          set -e
          bash /tmp/builder/Patches/syscall_hook_patches.sh ./
          echo "Manual hooks selesai"

      - name: Select toolchain
        env:
          TOOLCHAIN: ${{ github.event.inputs.toolchain }}
        run: |
          case "$TOOLCHAIN" in
            "gnu 13"|"proton 13"|"gcc 9") echo "Toolchain: $TOOLCHAIN" ;;
            *) echo "::error::Pilih gnu 13 / proton 13 / gcc 9"; exit 1 ;;
          esac

      - name: Restore ccache
        id: ccache_restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache44-${{ github.event.inputs.toolchain }}-${{ github.event.inputs.branch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache44-${{ github.event.inputs.toolchain }}-${{ github.event.inputs.branch }}-
            ccache44-${{ github.event.inputs.toolchain }}-

      - name: Cache toolchain
        id: tc_cache
        if: ${{ github.event.inputs.toolchain == 'proton 13' }}
        uses: actions/cache@v4
        with:
          path: ~/proton-clang
          key: toolchain44-llvm-proton13-v1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git patch \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libncurses-dev libssl-dev zstd wget xz-utils

      - name: Install GCC 9 cross
        if: ${{ github.event.inputs.toolchain == 'gcc 9' }}
        run: |
          sudo apt-get install -y gcc-9-aarch64-linux-gnu gcc-9-arm-linux-gnueabi
          aarch64-linux-gnu-gcc-9 --version | head -1

      - name: Fetch Proton Clang
        if: ${{ github.event.inputs.toolchain == 'proton 13' && steps.tc_cache.outputs.cache-hit != 'true' }}
        run: |
          git clone -q --depth 1 https://github.com/kdrag0n/proton-clang "$HOME/proton-clang"
          rm -rf "$HOME/proton-clang/.git"
          [ ! -x "$HOME/proton-clang/bin/clang" ] && echo "::error::Proton clang hilang" && exit 1
          "$HOME/proton-clang/bin/clang" --version | head -1

      - name: Setup toolchain env
        env:
          TOOLCHAIN: ${{ github.event.inputs.toolchain }}
          KCFLAGS_W: ${{ github.event.inputs.kcflags_w }}
        run: |
          case "$TOOLCHAIN" in
            "proton 13")
              TC="$HOME/proton-clang"
              echo "TC_BIN=$TC/bin" >> "$GITHUB_ENV"
              echo "CCACHE_PATH=$TC/bin" >> "$GITHUB_ENV"
              echo "TC_MAKE_ARGS=CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"
              CCACHE_LINKS="clang"
              TC_KCFLAGS="-Wno-error -Wno-error=incompatible-pointer-types"
              ;;
            "gcc 9")
              echo "TC_MAKE_ARGS=CC=aarch64-linux-gnu-gcc-9 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"
              CCACHE_LINKS="aarch64-linux-gnu-gcc-9"
              TC_KCFLAGS="-Wno-error"
              ;;
            *)
              echo "TC_MAKE_ARGS=CC=aarch64-linux-gnu-gcc CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"
              CCACHE_LINKS="aarch64-linux-gnu-gcc arm-linux-gnueabi-gcc"
              TC_KCFLAGS="-Wno-error -Wno-error=enum-int-mismatch -Wno-error=incompatible-pointer-types"
              ;;
          esac
          [ "$KCFLAGS_W" = "true" ] && TC_KCFLAGS="-w"
          echo "TC_KCFLAGS=$TC_KCFLAGS" >> "$GITHUB_ENV"

          mkdir -p "$HOME/ccache-bin"
          CCACHE_EXE="$(command -v ccache)"
          for l in $CCACHE_LINKS; do
            ln -sf "$CCACHE_EXE" "$HOME/ccache-bin/$l"
          done
          echo "$HOME/ccache-bin" >> "$GITHUB_PATH"

          {
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_COMPILERCHECK=%compiler% --version"
            echo "CCACHE_SLOPPINESS=time_macros"
          } >> "$GITHUB_ENV"
          ccache --max-size=3G && ccache --zero-stats

      - name: Make defconfig
        working-directory: kernel
        env:
          ENABLE_KSU: ${{ github.event.inputs.enable_ksu }}
          ENABLE_SUSFS: ${{ github.event.inputs.enable_susfs }}
          DEFCONFIG_NAME: ${{ github.event.inputs.defconfig }}
          KSU_DEBUG: ${{ github.event.inputs.ksu_debug }}
        run: |
          export PATH="$PATH${TC_BIN:+:$TC_BIN}"
          DEFCONFIG_PATH=$(find arch/arm64/configs -name "$DEFCONFIG_NAME" | head -1)
          [ -z "$DEFCONFIG_PATH" ] && echo "::error::$DEFCONFIG_NAME tidak ketemu" && exit 1
          DEFCONFIG_REL="${DEFCONFIG_PATH#arch/arm64/configs/}"
          make ARCH=arm64 O=out $TC_MAKE_ARGS "$DEFCONFIG_REL"

          if [ "$ENABLE_KSU" = "true" ] && [ "$ENABLE_SUSFS" = "true" ]; then
            echo "CONFIG_KSU=y" >> out/.config
            echo "CONFIG_KSU_SUSFS=y" >> out/.config
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> out/.config
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> out/.config
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> out/.config
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> out/.config
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> out/.config
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> out/.config
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> out/.config
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> out/.config
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> out/.config
          elif [ "$ENABLE_KSU" = "true" ]; then
            echo "CONFIG_KSU=y" >> out/.config
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
          fi
          if [ "$ENABLE_KSU" = "true" ]; then
            [ "$KSU_DEBUG" = "true" ] && echo "CONFIG_KSU_DEBUG=y" >> out/.config || echo "# CONFIG_KSU_DEBUG is not set" >> out/.config
          fi
          echo "# CONFIG_DEBUG_INFO is not set" >> out/.config
          make ARCH=arm64 O=out $TC_MAKE_ARGS olddefconfig
          grep -n "CONFIG_KSU" out/.config || true

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="$PATH${TC_BIN:+:$TC_BIN}"
          [ -n "$TC_BIN" ] && command -v clang && clang --version | head -1
          make ARCH=arm64 O=out $TC_MAKE_ARGS KCFLAGS="$TC_KCFLAGS" -j"$(nproc)" Image.gz dtbs

      - name: Pack Image.gz-dtb
        working-directory: kernel
        run: |
          DTB_PATH=""
          for p in sdm636 sdm660; do
            FOUND=$(find out/arch/arm64/boot/dts -name "${p}*.dtb" | sort | head -1)
            if [ -n "$FOUND" ]; then DTB_PATH="$FOUND"; break; fi
          done
          [ -z "$DTB_PATH" ] && { find out/arch/arm64/boot/dts -name '*.dtb' | sort; echo "::error::DTB hilang"; exit 1; }
          cat out/arch/arm64/boot/Image.gz "$DTB_PATH" > out/arch/arm64/boot/Image.gz-dtb
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Verify KSU
        if: ${{ github.event.inputs.enable_ksu == 'true' }}
        working-directory: kernel
        continue-on-error: true
        run: |
          grep "CONFIG_KSU" out/.config || true
          grep -q "ksu" out/System.map && echo "✅ KSU aktif" || echo "⚠️ KSU belum aktif"

      - name: Upload hasil
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: X00TD-4.4-${{ github.event.inputs.toolchain }}-${{ github.run_id }}
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: warn

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache44-${{ github.event.inputs.toolchain }}-${{ github.event.inputs.branch }}-${{ github.run_id }}-${{ github.run_attempt }}
